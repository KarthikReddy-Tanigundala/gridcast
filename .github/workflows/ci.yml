name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Unit tests (timezone, features/leakage, metrics, backtest integrity, parsers)
        run: pytest

      # No network and no secrets: the committed raw extracts rebuild the modelling table, and a
      # short walk-forward run proves the whole modelling path still executes end to end.
      - name: Rebuild dataset from committed raw data
        run: python -m gridcast.data.build_dataset

      - name: Smoke backtest (last ~6 weeks, demand + price, incl. classical)
        run: python -m gridcast.evaluation.backtest --smoke --target all
